name: Build Kernel

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y python3 python3-pip git zip curl

    - name: Integrate KSU
      run: |
        curl -L https://github.com/bmax121/KernelPatch/releases/latest/download/kptools-linux -o kptools
        curl -L https://github.com/bmax121/KernelPatch/releases/latest/download/kpimg-android -o kpimg-android
        curl -L https://github.com/bmax121/KernelPatch/releases/latest/download/kpimg-linux -o kpimg


    - name: Run build script
      run: |
        python3 build.py


    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: karnal
        path: |
          **/Image*
          **/*.zip